<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: artwork/stream hosts are provider-controlled and DYNAMIC —
         Audius serves art from rotating content nodes (audius-creator-*.theblueprint.xyz,
         creatornode.*, …) and Radio Browser station favicons/streams live on the
         stations' own domains — so img-src / media-src allow https:/http: as
         schemes instead of an untenable host whitelist. Script execution stays
         locked to 'self'; images and media are passive content (no script exec). -->
    <meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: blob: aura: https: http:;
    media-src 'self' aura: blob: https: http:;
    connect-src 'self' http://localhost:5173 ws://localhost:5173 https://lrclib.net;
  "
/>

    <title>Aura — ConsoleX Music Player</title>
    <!-- Prevent white flash on load in Electron -->
    <style>html, body { background: #0A0A0F; margin: 0; }</style>
    <!-- Geist font from Google's CDN (Vercel Geist is on fonts.googleapis.com) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
